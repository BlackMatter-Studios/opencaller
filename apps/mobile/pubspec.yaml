name: opencaller_mobile
description: "OpenCaller: Ultra-lightweight, 100% open-source, community-driven Truecaller alternative"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  dio: ^5.8.0+1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true
